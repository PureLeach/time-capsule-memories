basePath: /
definitions:
  models.CapsuleResponse:
    properties:
      created_at:
        type: string
      files_folder_uuid:
        type: string
      id:
        type: integer
      message:
        type: string
      recipient_email:
        type: string
      send_at:
        type: string
      sender_name:
        type: string
      status:
        $ref: '#/definitions/models.CapsuleStatus'
    type: object
  models.CapsuleStatus:
    enum:
    - waiting
    - in progress
    - done
    type: string
    x-enum-varnames:
    - StatusWaiting
    - StatusInProgress
    - StatusDone
  models.CreateCapsuleRequest:
    properties:
      files_folder_uuid:
        example: 07023417-5079-429d-a113-cbef2ef164d7
        type: string
      message:
        example: Test Message
        maxLength: 4096
        type: string
      recipient_email:
        example: test@example.com
        maxLength: 255
        type: string
      send_at:
        example: "2099-11-18"
        type: string
      sender_name:
        example: John Doe
        maxLength: 100
        type: string
    required:
    - message
    - recipient_email
    - send_at
    - sender_name
    type: object
  models.CreateFeedbackRequest:
    properties:
      message:
        example: Test Message
        maxLength: 4096
        type: string
    required:
    - message
    type: object
  models.EmailDataRequest:
    properties:
      body:
        example: Test body
        maxLength: 4096
        type: string
      files_folder_uuid:
        example: 07023417-5079-429d-a113-cbef2ef164d7
        type: string
      recipient_email:
        example: test@example.com
        maxLength: 255
        type: string
      subject:
        example: Test subject
        maxLength: 255
        type: string
    required:
    - body
    - recipient_email
    - subject
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.FeedbackResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      message:
        type: string
    type: object
  models.PresignedUpload:
    properties:
      fields:
        additionalProperties:
          type: string
        type: object
      url:
        type: string
    type: object
host: backend.localhost
info:
  contact:
    name: Source and issues
    url: https://github.com/MaxBarannikov/time-capsule-memories
  description: Schedules messages, with optional image attachments, for delivery by
    email on a future date.
  title: Time Capsule Memories API
  version: "1.0"
paths:
  /capsules:
    post:
      consumes:
      - application/json
      description: Schedules a message, with optional attachments, for delivery on
        a future date.
      parameters:
      - description: Capsule creation payload
        in: body
        name: capsule
        required: true
        schema:
          $ref: '#/definitions/models.CreateCapsuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Capsule created successfully
          schema:
            $ref: '#/definitions/models.CapsuleResponse'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Failed to create capsule
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a new capsule
      tags:
      - capsules
  /feedback:
    post:
      consumes:
      - application/json
      description: Stores a free-form feedback message.
      parameters:
      - description: Feedback data
        in: body
        name: feedback
        required: true
        schema:
          $ref: '#/definitions/models.CreateFeedbackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Feedback successfully created
          schema:
            $ref: '#/definitions/models.FeedbackResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Submit user feedback
      tags:
      - feedback
  /generate-presigned-url:
    get:
      description: Returns a signed multipart/form-data POST target scoped to one
        directory. The signed policy pins the content type and caps the upload at
        5 MB, so the limits hold even if the client ignores them. Submit the returned
        fields verbatim, then the file part.
      parameters:
      - description: Target directory UUID
        in: query
        name: directory
        required: true
        type: string
      - description: Image MIME type
        enum:
        - image/jpeg
        - image/png
        - image/webp
        - image/gif
        in: query
        name: content_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Upload target generated successfully
          schema:
            $ref: '#/definitions/models.PresignedUpload'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Failed to generate upload target
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Generate a presigned upload target for an attachment
      tags:
      - file
  /healthz:
    get:
      description: Reports that the process is up. Does not touch dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: Service is alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: Reports per-dependency health. Returns 503 when any check fails.
      produces:
      - application/json
      responses:
        "200":
          description: All dependencies reachable
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: At least one dependency is down
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
  /send-test-email:
    post:
      consumes:
      - application/json
      description: Development-only helper for verifying SMTP delivery end to end.
        Registered only when ENABLE_TEST_EMAIL_ENDPOINT is true, because it is unauthenticated
        and would otherwise let anyone send mail through the configured relay.
      parameters:
      - description: Email payload
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/models.EmailDataRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Email sent successfully
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Failed to send email
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Send a test email
      tags:
      - email
swagger: "2.0"
