# Application stack. Development extras live in docker-compose.override.yml,
# which Compose merges in automatically; opt out with:
#   docker compose -f docker-compose.yml up
services:
  traefik:
    image: traefik:v2.11
    container_name: time-capsule-memories-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      time-capsule-network:
        # The backend and the browser must reach the object store under the same
        # hostname, or the upload signatures will not match.
        aliases:
          - ${MINIO_ENDPOINT}

  postgres:
    image: postgres:16.3-alpine
    container_name: time-capsule-memories-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      PGPORT: ${POSTGRES_PORT}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - time-capsule-network
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -p ${POSTGRES_PORT} -d ${POSTGRES_DB_NAME}
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: time-capsule-memories-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: minio.localhost
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    networks:
      - time-capsule-network
    healthcheck:
      test: mc ready local
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.minio-console.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"

      - "traefik.http.routers.minio-api.rule=Host(`minio-api.localhost`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.routers.minio-api.service=minio-api-svc"
      - "traefik.http.services.minio-api-svc.loadbalancer.server.port=9000"

  backend:
    container_name: time-capsule-memories-backend
    build:
      context: ./backend
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - time-capsule-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    container_name: time-capsule-memories-frontend
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time, so it is an arg, not an env var.
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL}
    depends_on:
      - backend
    networks:
      - time-capsule-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`frontend.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"

networks:
  time-capsule-network:
    driver: bridge

volumes:
  pgdata:
  minio_data:
